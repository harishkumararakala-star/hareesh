<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            height: 100%;
            width: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .container {
            width: 800px;
            height: 400px;
            display: flex;
            border-radius: 20px;
            box-shadow: 0 15px 30px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .sign in {
            width: 50%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 20px;
        }

        .sign h2 {
            margin-bottom: 20px;
            color: brown;

        }

        input {
            width: 280px;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            outline: none;
        }

        .forgot {
            margin: 10px 0;
            font-size: 14px;
            color: rgb(12, 1, 1);
        }

        .signin-btn {
            padding: 10px 35px;
            border: none;
            border-radius: 20px;
            background: #0b82b9;
            color: white;

        }

        .signup {
            width: 50%;
            background: #14737c;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .signup h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .signup-btn {
            padding: 10px 40px;
            border: 1px solid rgb(69, 14, 189);
            border-radius: 20px;
            color: rgb(70, 14, 252);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="sign">
            <h2>Sign in</h2>
            <label for="mail"></label>
            <input type="email" placeholder="User Email">
            <label for="password"></label>
            <input type="password" placeholder="Password">
            <p class="forgot">Forgot your password?</p>
            <button class="signin-btn">SIGN IN</button>
        </div>

        <div class="signup">
            <h2>SIGN UP</h2>
            <p>Sign up here if you have account</p>
            <button class="signup-btn">SIGN UP</button>
        </div>

    </div>

</body>

</html>
