<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            
        }

        body {
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* background: linear-gradient(to right, #e36186, #d85f8f); */
            background-image: url("burger.jpg");
        }

        .card {
            width: 350px;
            background: #c2b4b4;
            border-radius: 20px;
            box-shadow: rgba(88, 20, 20, 0.2);
        }

        .top-image img {
            width: 100%;
            height: 220px;
        }

        .content {
            padding: 80px 30px 30px;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .status h3 {
            color: #1e88e5;
            font-size: 32px;
        }

        .status p {
            color: rgb(198, 23, 23);
            margin-top: 5px;
        }

        .follow {
            width: 100%;
            padding: 20px;
            border-radius: 30px;
            background: #ff00dd;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .matter {
            color: #4114b3;
            font-size: 16px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="top-image">
            <img src="../html practice/boyit.jpg" alt="">
            
        </div>

        <div class="content">

            <h2>Hareesh Royal</h2>
            <p>Assosiate system engineer</p>

            <div class="status">
                <div>
                    <h3>55</h3>
                    <p>Followers</p>
                </div>

                <div>
                    <h3>1000</h3>
                    <p>Following</p>
                </div>
            </div>

            <button class="follow">Follow</button>

            <p class="matter">
                hareesh works assosiate system engineer in oppty tech hub <br>since last one month in oppty tech hub
            </p>

        </div>

    </div>

</body>

</html>
