<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppty ID Card</title>

    <style>
        body {
            background: rgb(243, 239, 233);
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .id-card {
            width: 70%;
            height: 70%;
            background: orange;
            border: 2px solid orange;
            border-radius: 50px;

        }


        .header {
            background: white;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            /* border-radius: 50%; */
        }

        .logo img {
            border-radius: 50%;
            height: 80px;
            width: 80px;
        }
        .company-name {
            font-size: 60px;
            font-style: italic;
            color: coral;
        }

        .content {
            display: flex;
            padding: 50px;
            gap: 60px;
        }

        .photo-box {
            width: 320px;
            height: 400px;
            border: 5px solid #000;
            background: #e1d3d3;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .label {
            width: 80px;
            font-size: 24px;
        }

        .barcode {
            margin-top: 40px;
            font-size: 50px;
            height: 40px;
        }

        .signature {
                    text-align: right;
        }
        input {
            border-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="id-card">

        <div class="header">
            <div class="logo"><img src="../html practice/oppty logo.jfif" alt=""></div>
            <div class="company-name">OPPTY TECH HUB</div>
        </div>

        <div class="content">

            <div class="photo-box">
                <img src="../html practice/boyit.jpg" alt="Student Photo">
            </div>

            <div class="details">

                <div class="row">
                    <div class="label">ID</div>

                </div>

                <div class="row">
                    <div class="label">Name</div>

                </div>

                <div class="row">
                    <div class="label">Class</div>
                </div>
                <div class="row">
                    <div class="label">D.O.B</div>
                </div>

                <div class="row">
                    <div class="label">Address</div>

                </div>

                <div class="row">
                    <div class="label">Phone</div>

                </div>

                <div class="barcode">||||||||||||||||||||</div>

                <div class="signature">
                    <h2>
                        signature
                    </h2>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
